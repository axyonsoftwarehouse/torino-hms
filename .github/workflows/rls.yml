name: RLS e2e

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/migrations/**"
      - "tests/rls/**"
      - ".github/workflows/rls.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "tests/rls/**"
      - ".github/workflows/rls.yml"

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install
        run: npm ci

      - name: Start Supabase
        run: supabase start

      - name: Reset database (migrations + seed)
        run: supabase db reset

      - name: Export test env
        run: |
          supabase status -o env > /tmp/supabase.env
          cat /tmp/supabase.env
          echo "SUPABASE_TEST_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d'=' -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_ANON_KEY=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d'=' -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d'=' -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: Run RLS tests
        run: npm run test:rls
